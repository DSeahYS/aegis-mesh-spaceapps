    if(m)loadFallback(m[1]);
  },true);
})();
</script>

<script>window.duration = 30;
function clamp(val, min, max) {
  return Math.max(min, Math.min(max, val));
}
function lerp(start, end, t) {
  return start + (end - start) * t;
}
function power4Out(t) {
  t = clamp(t, 0, 1);
  return 1 - Math.pow(1 - t, 4);
}
function power4In(t) {
  t = clamp(t, 0, 1);
  return Math.pow(t, 4);
}
const scene1 = document.getElementById("scene1");
const s1Number = document.getElementById("s1-number");
const s1Subtext = document.getElementById("s1-subtext");
const scene2a = document.getElementById("scene2a");
const s2aAt = document.getElementById("s2a-at");
const s2aFifteen = document.getElementById("s2a-fifteen");
const s2aKms = document.getElementById("s2a-kms");
const scene2b = document.getElementById("scene2b");
const s2bText = document.getElementById("s2b-text");
const scene2c = document.getElementById("scene2c");
const s2cText = document.getElementById("s2c-text");
const scene3 = document.getElementById("scene3");
const s3Title = document.getElementById("s3-title");
const s3Subtext = document.getElementById("s3-subtext");
const scene4a = document.getElementById("scene4a");
const s4aStat = document.getElementById("s4a-stat");
const s4aLabel = document.getElementById("s4a-label");
const scene4b = document.getElementById("scene4b");
const s4bStat = document.getElementById("s4b-stat");
const s4bLabel = document.getElementById("s4b-label");
const scene4c = document.getElementById("scene4c");
const s4cStat = document.getElementById("s4c-stat");
const s4cLabel = document.getElementById("s4c-label");
const scene5 = document.getElementById("scene5");
const s5Title = document.getElementById("s5-title");
const s5Subtitle = document.getElementById("s5-subtitle");
const s5Footer = document.getElementById("s5-footer");
function hideAll() {
  const scenes = [scene1, scene2a, scene2b, scene2c, scene3, scene4a, scene4b, scene4c, scene5];
  scenes.forEach((s) => {
    s.style.opacity = "0";
    s.style.visibility = "hidden";
    s.style.transform = "none";
  });
}
window.seek = function(t) {
  hideAll();
  if (t < 0 || t >= 30) {
    return;
  }
  if (t >= 0 && t < 5) {
    scene1.style.opacity = "1";
    scene1.style.visibility = "visible";
    const entryP = power4Out(t / 0.35);
    const scaleY = lerp(0.2, 1, entryP);
    const scaleX = lerp(1.5, 1, entryP);
    const countProgress = power4Out((t - 0.2) / 3);
    const currentNum = Math.floor(lerp(0, 3e5, countProgress));
    s1Number.innerText = currentNum.toLocaleString("en-US");
    let pulseScale = 1;
    if (t >= 3.2) {
      pulseScale = 1 + 0.015 * Math.sin((t - 3.2) * 12);
    }
    s1Number.style.transform = `scale(${scaleX * pulseScale}, ${scaleY * pulseScale})`;
    const subP = power4Out((t - 0.6) / 0.4);
    const subY = lerp(50, 0, subP);
    s1Subtext.style.opacity = subP.toFixed(3);
    s1Subtext.style.transform = `translateY(${subY}px)`;
  } else if (t >= 5 && t < 7) {
    scene2a.style.opacity = "1";
    scene2a.style.visibility = "visible";
    if (t >= 5 && t < 5.6) {
      s2aAt.style.display = "block";
      s2aFifteen.style.display = "none";
      s2aKms.style.display = "none";
      const p = power4Out((t - 5) / 0.25);
      const s = lerp(2.2, 1, p);
      s2aAt.style.transform = `scale(${s})`;
      s2aAt.style.opacity = p.toFixed(3);
    } else if (t >= 5.6 && t < 6.2) {
      s2aAt.style.display = "none";
      s2aFifteen.style.display = "block";
      s2aKms.style.display = "none";
      const p = power4Out((t - 5.6) / 0.25);
      const sy = lerp(2.8, 1, p);
      const sx = lerp(0.3, 1, p);
      s2aFifteen.style.transform = `scale(${sx}, ${sy})`;
      s2aFifteen.style.opacity = p.toFixed(3);
    } else {
      s2aAt.style.display = "none";
      s2aFifteen.style.display = "none";
      s2aKms.style.display = "block";
      const p = power4Out((t - 6.2) / 0.25);
      const s = lerp(1.8, 1, p);
      s2aKms.style.transform = `scale(${s})`;
      s2aKms.style.opacity = p.toFixed(3);
    }
  } else if (t >= 7 && t < 8.5) {
    scene2b.style.opacity = "1";
    scene2b.style.visibility = "visible";
    const p = power4Out((t - 7) / 0.3);
    const s = lerp(2, 1, p);
    const rot = lerp(-4, 0, p);
    s2bText.style.transform = `scale(${s}) rotate(${rot}deg)`;
    s2bText.style.opacity = p.toFixed(3);
  } else if (t >= 8.5 && t < 10) {
    scene2c.style.opacity = "1";
    scene2c.style.visibility = "visible";
    const p = power4Out((t - 8.5) / 0.3);
    const sy = lerp(0.2, 1, p);
    const sx = lerp(1.6, 1, p);
    s2cText.style.transform = `scale(${sx}, ${sy})`;
    s2cText.style.opacity = p.toFixed(3);
  } else if (t >= 10 && t < 14) {
    scene3.style.opacity = "1";
    scene3.style.visibility = "visible";
    const p = power4Out((t - 10) / 0.35);
    const s = lerp(2.4, 1, p);
    const letterSpacing = lerp(40, -2, p);
    s3Title.style.transform = `scale(${s})`;
    s3Title.style.letterSpacing = `${letterSpacing}px`;
    s3Title.style.opacity = p.toFixed(3);
    const subP = power4Out((t - 10.4) / 0.4);
    const subY = lerp(60, 0, subP);
    s3Subtext.style.opacity = subP.toFixed(3);
    s3Subtext.style.transform = `translateY(${subY}px)`;
  } else if (t >= 14 && t < 17.333) {
    scene4a.style.opacity = "1";
    scene4a.style.visibility = "visible";
    let translateX = 0;
    let opacity = 1;
    if (t < 14.35) {
      const p = power4Out((t - 14) / 0.35);
      translateX = lerp(-1200, 0, p);
      opacity = p;
    } else if (t >= 17) {
      const p = power4In((t - 17) / 0.333);
      translateX = lerp(0, 1200, p);
      opacity = 1 - p;
    }
    scene4a.style.transform = `translateX(${translateX}px)`;
    scene4a.style.opacity = opacity.toFixed(3);
  } else if (t >= 17.333 && t < 20.666) {
    scene4b.style.opacity = "1";
    scene4b.style.visibility = "visible";
    let scale = 1;
    let opacity = 1;
    if (t < 17.683) {
      const p = power4Out((t - 17.333) / 0.35);
      scale = lerp(2.8, 1, p);
      opacity = p;
    } else if (t >= 20.333) {
      const p = power4In((t - 20.333) / 0.333);
      scale = lerp(1, 0.1, p);
      opacity = 1 - p;
    }
    scene4b.style.transform = `scale(${scale})`;
    scene4b.style.opacity = opacity.toFixed(3);
  } else if (t >= 20.666 && t < 24) {
    scene4c.style.opacity = "1";
    scene4c.style.visibility = "visible";
    let translateY = 0;
    let opacity = 1;
    if (t < 21.016) {
      const p = power4Out((t - 20.666) / 0.35);
      translateY = lerp(800, 0, p);
      opacity = p;
    } else if (t >= 23.666) {
      const p = power4In((t - 23.666) / 0.334);
      translateY = lerp(0, -800, p);
      opacity = 1 - p;
    }
    scene4c.style.transform = `translateY(${translateY}px)`;
    scene4c.style.opacity = opacity.toFixed(3);
  } else if (t >= 24 && t < 30) {
    scene5.style.opacity = "1";
    scene5.style.visibility = "visible";
    if (t >= 29.95) {
      scene5.style.opacity = "0";
      scene5.style.visibility = "hidden";
      return;
    }
    const p = power4Out((t - 24) / 0.35);
    const s = lerp(1.8, 1, p);
    s5Title.style.transform = `scale(${s})`;
    s5Title.style.opacity = p.toFixed(3);
    const subP = power4Out((t - 24.3) / 0.4);
    const subY = lerp(40, 0, subP);
    s5Subtitle.style.opacity = subP.toFixed(3);
    s5Subtitle.style.transform = `translateY(${subY}px)`;
    const footP = power4Out((t - 24.6) / 0.4);
    const footY = lerp(30, 0, footP);
    s5Footer.style.opacity = (footP * 0.85).toFixed(3);
    s5Footer.style.transform = `translateY(${footY}px)`;
  }
};
window.seek(0);</script></body>
