<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>AEGIS-MESH Kinetic Pitch</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: 'Archivo Black';
        src: url('fonts/ArchivoBlack-400.woff2') format('woff2');
        font-weight: 400;
        font-style: normal;
      }
      @font-face {
        font-family: 'Inter';
        src: url('fonts/Inter-700.woff2') format('woff2');
        font-weight: 700;
        font-style: normal;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000000;
        color: #ffffff;
      }

      #root {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
        background: #000000;
      }

      /* Scene Clips - framework handles visibility by data-start/data-duration */
      .clip {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 0 100px;
      }

      /* Typography */
      .main-number {
        font-family: 'Archivo Black', sans-serif;
        font-size: 270px;
        line-height: 0.9;
        text-transform: uppercase;
        text-align: center;
        letter-spacing: -4px;
        font-variant-numeric: tabular-nums;
        color: #ff2a2a;
        transform-origin: center center;
        will-change: transform;
      }

      .main-title {
        font-family: 'Archivo Black', sans-serif;
        font-size: 210px;
        line-height: 0.95;
        text-transform: uppercase;
        text-align: center;
        white-space: nowrap;
        letter-spacing: -2px;
        transform-origin: center center;
        will-change: transform, opacity;
      }

      .main-block {
        font-family: 'Archivo Black', sans-serif;
        font-size: 140px;
        line-height: 1.05;
        text-transform: uppercase;
        text-align: center;
        letter-spacing: -1px;
        transform-origin: center center;
        will-change: transform, opacity;
      }

      .sub-title {
        font-family: 'Inter', sans-serif;
        font-weight: 700;
        font-size: 42px;
        letter-spacing: 6px;
        text-transform: uppercase;
        text-align: center;
        margin-top: 36px;
        color: #ffffff;
        white-space: nowrap;
        transform-origin: center center;
        will-change: transform, opacity;
      }

      .footer-tag {
        font-family: 'Inter', sans-serif;
        font-weight: 700;
        font-size: 32px;
        letter-spacing: 5px;
        text-transform: uppercase;
        text-align: center;
        margin-top: 24px;
        color: rgba(255, 255, 255, 0.85);
        transform-origin: center center;
        will-change: transform, opacity;
      }

      .red {
        color: #ff2a2a;
      }

      .cyan {
        color: #00f0ff;
      }

      .white {
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="30"
      data-width="1920"
      data-height="1080"
    >
      <!-- 1. 0s to 5s: The Crisis -->
      <div id="scene1" class="clip" data-start="0" data-duration="5" data-track-index="0">
        <div id="s1-count" class="main-number">0</div>
        <div id="s1-sub" class="sub-title">COLLISION MANEUVERS IN 2025.</div>
      </div>

      <!-- 2A. 5s to 7s: The Speed - Slam words -->
      <div id="scene2a" class="clip" data-start="5" data-duration="2" data-track-index="0">
        <div id="s2a-at" class="main-title white">AT</div>
        <div id="s2a-num" class="main-number red" style="display:none;">15</div>
        <div id="s2a-kms" class="main-title red" style="display:none;">KM/S</div>
      </div>

      <!-- 2B. 7s to 8.5s: 24-HOUR RADAR WARNINGS -->
      <div id="scene2b" class="clip" data-start="7" data-duration="1.5" data-track-index="0">
        <div id="s2b-text" class="main-block white">
          24-HOUR RADAR<br>WARNINGS
        </div>
      </div>

      <!-- 2C. 8.5s to 10s: ARE OBSOLETE -->
      <div id="scene2c" class="clip" data-start="8.5" data-duration="1.5" data-track-index="0">
        <div id="s2c-text" class="main-title">
          <span class="white">ARE </span><span class="red">OBSOLETE.</span>
        </div>
      </div>

      <!-- 3. 10s to 14s: The Pivot - AEGIS-MESH -->
      <div id="scene3" class="clip" data-start="10" data-duration="4" data-track-index="0">
        <div id="s3-title" class="main-title cyan">AEGIS-MESH</div>
        <div id="s3-sub" class="sub-title">INSTANT EDGE-AI AVOIDANCE.</div>
      </div>

      <!-- 4A. 14s to 17.33s: 0.023 MS LATENCY -->
      <div id="scene4a" class="clip" data-start="14" data-duration="3.333" data-track-index="0">
        <div id="s4a-stat" class="main-title cyan">0.023 MS</div>
        <div id="s4a-sub" class="sub-title">LATENCY</div>
      </div>

      <!-- 4B. 17.33s to 20.66s: 38 KB MEMORY -->
      <div id="scene4b" class="clip" data-start="17.333" data-duration="3.333" data-track-index="0">
        <div id="s4b-stat" class="main-number cyan">38 KB</div>
        <div id="s4b-sub" class="sub-title">MEMORY</div>
      </div>

      <!-- 4C. 20.66s to 24s: 4.2 W ON POLARFIRE SOC -->
      <div id="scene4c" class="clip" data-start="20.666" data-duration="3.334" data-track-index="0">
        <div id="s4c-stat" class="main-title cyan">4.2 W</div>
        <div id="s4c-sub" class="sub-title">ON POLARFIRE SOC</div>
      </div>

      <!-- 5. 24s to 30s: The Close -->
      <div id="scene5" class="clip" data-start="24" data-duration="6" data-track-index="0">
        <div id="s5-title" class="main-title cyan">AEGIS-MESH</div>
        <div id="s5-sub" class="sub-title">THE IMMUNE SYSTEM FOR LOW EARTH ORBIT.</div>
        <div id="s5-foot" class="footer-tag">NASA SPACE APPS 2026.</div>
      </div>
    </div>

    <script>
      // Single paused master timeline registered on window.__timelines
      const tl = gsap.timeline({ paused: true });

      // ==========================================
      // BEAT 1: 0s - 5s (The Crisis: 300,000 count-up)
      // ==========================================
      const counterEl = document.getElementById("s1-count");
      const counterProxy = { val: 0 };

      // Number count-up roll from 0 to 300,000
      tl.to(
        counterProxy,
        {
          val: 300000,
          duration: 3.0,
          ease: "power4.out",
          onUpdate: function () {
            counterEl.textContent = Math.round(counterProxy.val).toLocaleString("en-US");
          },
        },
        0.2
      );

      // Entry squashed-to-full-height stretch slam
      tl.fromTo(
        "#s1-count",
        { scaleY: 0.15, scaleX: 1.8, opacity: 0 },
        { scaleY: 1, scaleX: 1, opacity: 1, duration: 0.4, ease: "power4.out" },
        0.05
      );

      // Subtext slide-in
      tl.fromTo(
        "#s1-sub",
        { y: 50, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power4.out" },
        0.6
      );

      // Subtle pulse before transition
      tl.to(
        "#s1-count",
        { scale: 1.03, duration: 0.12, yoyo: true, repeat: 3, ease: "sine.inOut" },
        3.5
      );

      // ==========================================
      // BEAT 2A: 5s - 7s (The Speed: AT -> 15 -> KM/S)
      // ==========================================
      // 5.0s: "AT" slams in
      tl.fromTo(
        "#s2a-at",
        { scale: 2.8, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.28, ease: "power4.out" },
        5.0
      );

      // 5.6s: swap to "15" slam
      tl.set("#s2a-at", { display: "none" }, 5.6);
      tl.set("#s2a-num", { display: "block" }, 5.6);
      tl.fromTo(
        "#s2a-num",
        { scaleY: 3.2, scaleX: 0.2, opacity: 0 },
        { scaleY: 1, scaleX: 1, opacity: 1, duration: 0.3, ease: "power4.out" },
        5.6
      );

      // 6.2s: swap to "KM/S" slam
      tl.set("#s2a-num", { display: "none" }, 6.2);
      tl.set("#s2a-kms", { display: "block" }, 6.2);
      tl.fromTo(
        "#s2a-kms",
        { scale: 2.4, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.3, ease: "power4.out" },
        6.2
      );

      // ==========================================
      // BEAT 2B: 7s - 8.5s (24-HOUR RADAR WARNINGS)
      // ==========================================
      tl.fromTo(
        "#s2b-text",
        { scale: 2.2, rotation: -3, opacity: 0 },
        { scale: 1, rotation: 0, opacity: 1, duration: 0.35, ease: "power4.out" },
        7.0
      );

      // ==========================================
      // BEAT 2C: 8.5s - 10s (ARE OBSOLETE.)
      // ==========================================
      tl.fromTo(
        "#s2c-text",
        { scaleX: 1.8, scaleY: 0.2, opacity: 0 },
        { scaleX: 1, scaleY: 1, opacity: 1, duration: 0.35, ease: "power4.out" },
        8.5
      );

      // ==========================================
      // BEAT 3: 10s - 14s (The Pivot: AEGIS-MESH)
      // ==========================================
      tl.fromTo(
        "#s3-title",
        { scale: 2.8, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.4, ease: "power4.out" },
        10.0
      );
      tl.fromTo(
        "#s3-sub",
        { y: 60, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, ease: "power4.out" },
        10.45
      );

      // ==========================================
      // BEAT 4A: 14s - 17.33s (0.023 MS LATENCY - slide-in)
      // ==========================================
      tl.fromTo(
        "#s4a-stat",
        { x: -1400, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.35, ease: "power4.out" },
        14.0
      );
      tl.fromTo(
        "#s4a-sub",
        { x: 1400, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.35, ease: "power4.out" },
        14.1
      );
      // fast beat exit
      tl.to("#s4a-stat", { x: 1400, opacity: 0, duration: 0.25, ease: "power4.in" }, 17.05);
      tl.to("#s4a-sub", { x: -1400, opacity: 0, duration: 0.25, ease: "power4.in" }, 17.05);

      // ==========================================
      // BEAT 4B: 17.33s - 20.66s (38 KB MEMORY - punch-in)
      // ==========================================
      tl.fromTo(
        "#s4b-stat",
        { scale: 3.5, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.35, ease: "power4.out" },
        17.333
      );
      tl.fromTo(
        "#s4b-sub",
        { scale: 0.2, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.35, ease: "power4.out" },
        17.45
      );
      // fast beat exit
      tl.to("#s4b-stat", { scale: 0.1, opacity: 0, duration: 0.25, ease: "power4.in" }, 20.4);
      tl.to("#s4b-sub", { scale: 0.1, opacity: 0, duration: 0.25, ease: "power4.in" }, 20.4);

      // ==========================================
      // BEAT 4C: 20.66s - 24s (4.2 W ON POLARFIRE SOC - slide-in)
      // ==========================================
      tl.fromTo(
        "#s4c-stat",
        { y: 800, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.35, ease: "power4.out" },
        20.666
      );
      tl.fromTo(
        "#s4c-sub",
        { y: -600, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.35, ease: "power4.out" },
        20.78
      );
      // fast beat exit
      tl.to("#s4c-stat", { y: -800, opacity: 0, duration: 0.25, ease: "power4.in" }, 23.7);
      tl.to("#s4c-sub", { y: 600, opacity: 0, duration: 0.25, ease: "power4.in" }, 23.7);

      // ==========================================
      // BEAT 5: 24s - 30s (The Close: End Card)
      // ==========================================
      tl.fromTo(
        "#s5-title",
        { scale: 2.2, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.38, ease: "power4.out" },
        24.0
      );
      tl.fromTo(
        "#s5-sub",
        { y: 40, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, ease: "power4.out" },
        24.35
      );
      tl.fromTo(
        "#s5-foot",
        { y: 30, opacity: 0 },
        { y: 0, opacity: 0.85, duration: 0.45, ease: "power4.out" },
        24.7
      );

      // Hard cut to black at 29.95s - 30.0s
      tl.to(["#s5-title", "#s5-sub", "#s5-foot"], { opacity: 0, duration: 0.05 }, 29.95);

      // Register timeline for HyperFrames runtime seek
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
